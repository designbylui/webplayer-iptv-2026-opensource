<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZzBox Player</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <img src="logo.png" alt="ZzBox" class="loading-logo">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="bg-effects">
            <div class="glow-orb top-left"></div>
            <div class="glow-orb bottom-right"></div>
            <div class="grid-overlay"></div>
        </div>

        <div class="login-container">
            <div class="login-header">
                <img src="logo.png" alt="ZzBox" class="logo">
                <h1>ZzBox <span class="highlight">Player</span></h1>
                <p class="subtitle">Streaming Premium <span class="version">v8.1</span></p>
            </div>

            <form id="login-form" class="glass-panel">
                <div class="input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="server" placeholder="Servidor (ex: http://servidor.com)" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" placeholder="Usuário" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" placeholder="Senha" required>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn-primary">
                    <span class="btn-text">ENTRAR</span>
                    <span class="btn-loading" style="display: none;">
                        <div class="btn-spinner"></div>
                        CONECTANDO...
                    </span>
                </button>

                <div id="login-status" class="status-message"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <img src="logo.png" alt="ZzBox" class="sidebar-logo">
                <span class="sidebar-title">ZzBox</span>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="live">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    <span>TV ao Vivo</span>
                </button>
                <button class="nav-item" data-section="movies">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="2" y1="7" x2="7" y2="7"></line>
                        <line x1="2" y1="17" x2="7" y2="17"></line>
                        <line x1="17" y1="17" x2="22" y2="17"></line>
                        <line x1="17" y1="7" x2="22" y2="7"></line>
                    </svg>
                    <span>Filmes</span>
                </button>
                <button class="nav-item" data-section="series">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                        <polyline points="17 2 12 7 7 2"></polyline>
                    </svg>
                    <span>Séries</span>
                </button>
            </nav>

            <div class="user-info">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="user-details">
                    <span id="user-name" class="user-username">Usuário</span>
                    <span id="user-exp" class="user-expiry">Expira: --</span>
                </div>
                <button id="logout-btn" class="logout-btn" title="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar...">
                </div>
                <button id="mobile-menu-btn" class="mobile-menu-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </header>

            <!-- Categories View -->
            <div id="categories-view" class="content-view active">
                <h2 class="section-title" id="section-title">TV ao Vivo</h2>
                <div id="categories-grid" class="categories-grid">
                    <!-- Categories will be loaded here -->
                </div>
            </div>

            <!-- Content View -->
            <div id="content-view" class="content-view">
                <button id="back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Voltar</span>
                </button>
                <h2 class="section-title" id="content-title">Categoria</h2>
                <div id="content-grid" class="content-grid">
                    <!-- Content will be loaded here -->
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="content-loading" class="content-loading" style="display: none;">
                <div class="spinner"></div>
                <p>Carregando...</p>
            </div>
        </main>
    </div>

    <!-- Player Modal -->
    <div id="player-modal" class="player-modal">
        <div class="player-container">
            <button id="close-player" class="close-player">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="player-wrapper" class="player-wrapper">
                <video id="video-player" playsinline></video>

                <!-- Player Controls -->
                <div class="player-controls">
                    <div class="player-top">
                        <h3 id="player-title" class="player-title">Título</h3>
                        <span id="live-badge" class="live-badge" style="display: none;">AO VIVO</span>
                    </div>

                    <!-- Progress Bar (VOD) -->
                    <div id="progress-container" class="progress-container" style="display: none;">
                        <div class="progress-bar">
                            <div id="buffered-bar" class="buffered-bar"></div>
                            <div id="progress-bar" class="progress-fill"></div>
                        </div>
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="player-bottom">
                        <div class="controls-left">
                            <button id="play-pause-btn" class="control-btn">
                                <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                    <rect x="6" y="4" width="4" height="16"></rect>
                                    <rect x="14" y="4" width="4" height="16"></rect>
                                </svg>
                            </button>

                            <div class="volume-control">
                                <button id="mute-btn" class="control-btn">
                                    <svg id="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    </svg>
                                    <svg id="muted-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" style="display: none;">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                        <line x1="23" y1="9" x2="17" y2="15"></line>
                                        <line x1="17" y1="9" x2="23" y2="15"></line>
                                    </svg>
                                </button>
                                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
                            </div>
                        </div>

                        <div class="controls-right">
                            <!-- Audio Track Selector -->
                            <div class="track-selector">
                                <button id="audio-btn" class="control-btn" title="Áudio">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                </button>
                                <div id="audio-menu" class="track-menu">
                                    <div class="track-menu-header">Áudio</div>
                                    <div id="audio-tracks" class="track-list">
                                        <div class="track-item active">Padrão</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Subtitle Selector -->
                            <div class="track-selector">
                                <button id="subtitle-btn" class="control-btn" title="Legendas">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                                        <line x1="6" y1="12" x2="18" y2="12"></line>
                                        <line x1="6" y1="16" x2="14" y2="16"></line>
                                    </svg>
                                </button>
                                <div id="subtitle-menu" class="track-menu">
                                    <div class="track-menu-header">Legendas</div>
                                    <div id="subtitle-tracks" class="track-list">
                                        <div class="track-item active" data-index="-1">Desativado</div>
                                    </div>
                                </div>
                            </div>

                            <button id="fullscreen-btn" class="control-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <polyline points="9 21 3 21 3 15"></polyline>
                                    <line x1="21" y1="3" x2="14" y2="10"></line>
                                    <line x1="3" y1="21" x2="10" y2="14"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Loading Overlay -->
                <div id="player-loading" class="player-loading">
                    <div class="spinner"></div>
                </div>

                <!-- Error Overlay -->
                <div id="player-error" class="player-error" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p>Erro ao reproduzir</p>
                    <button id="retry-btn" class="btn-secondary">Tentar Novamente</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Series Modal -->
    <div id="series-modal" class="series-modal">
        <div class="series-container glass-panel">
            <button id="close-series" class="close-series">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="series-header">
                <img id="series-cover" class="series-cover" src="" alt="">
                <div class="series-info">
                    <h2 id="series-title">Título da Série</h2>
                    <p id="series-plot" class="series-plot">Descrição...</p>
                </div>
            </div>
            <div class="seasons-container">
                <div id="seasons-tabs" class="seasons-tabs">
                    <!-- Season tabs will be added here -->
                </div>
                <div id="episodes-grid" class="episodes-grid">
                    <!-- Episodes will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
